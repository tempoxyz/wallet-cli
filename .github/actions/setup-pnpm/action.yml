name: Setup pinned pnpm
description: Install the lockfile-verified JavaScript pnpm package using the configured Node.js
runs:
  using: composite
  steps:
    - name: Install pinned pnpm
      shell: bash
      run: |
        node <<'JS'
        const expected = require(`${process.env.GITHUB_WORKSPACE}/package.json`).packageManager;
        const actual = require(`${process.env.GITHUB_ACTION_PATH}/package.json`).dependencies.pnpm;
        if (expected !== `pnpm@${actual}`) throw new Error("Update the pnpm bootstrap lockfile to match packageManager");
        JS
        npm ci --prefix "$GITHUB_ACTION_PATH" --ignore-scripts --no-audit --no-fund
        echo "$GITHUB_ACTION_PATH/node_modules/.bin" >> "$GITHUB_PATH"
