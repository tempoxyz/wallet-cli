# Allow the Release workflow's prepare job (push to main) to mint a
# short-lived token that pushes the changelog-release branch and opens or
# updates the release PR. Replaces the built-in GITHUB_TOKEN so the org can
# turn off "Allow GitHub Actions to create and approve pull requests".
# App-created PRs also trigger pull_request workflows normally, so checks
# run on the release PR.
subject: repo:tempoxyz@211589300/wallet-cli@1266776969:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: tempoxyz/wallet-cli/\.github/workflows/release\.yml@refs/heads/main
permissions:
  contents: write
  pull_requests: write
