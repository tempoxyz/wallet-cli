name: Build

permissions: {}

on:
  push:
    tags:
      - "v*"
      - "tempo-wallet@*"
      - "tempo-request@*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose source should be built and published
        required: false
        type: string

jobs:
  parse-tag:
    name: Parse tag
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.parse.outputs.packages }}
      version: ${{ steps.parse.outputs.version }}
      release_tag: ${{ steps.parse.outputs.release_tag }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Parse release version from tag
        id: parse
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          TAG="$INPUT_RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
            PACKAGES='["tempo-wallet","tempo-request"]'
            RELEASE_TAG="$TAG"
          elif [[ "$TAG" == *"@"* ]]; then
            PACKAGE="${TAG%%@*}"
            VERSION="${TAG#*@}"
            RELEASE_TAG="$TAG"

            if [[ "$PACKAGE" == "tempo-wallet" || "$PACKAGE" == "tempo-request" ]]; then
              PACKAGES="[\"${PACKAGE}\"]"
            else
              echo "Unsupported package in tag: ${PACKAGE}" >&2
              exit 1
            fi
          elif [[ "$TAG" == refs/heads/* || "$TAG" == "$GITHUB_REF" ]]; then
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            PACKAGES='["tempo-wallet","tempo-request"]'
            RELEASE_TAG="$TAG"
          else
            echo "Unsupported tag format: ${TAG}" >&2
            exit 1
          fi

          {
            echo "packages=${PACKAGES}"
            echo "version=${VERSION}"
            echo "release_tag=${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"

  # One job per platform builds every package the tag names: they share one install and
  # JavaScript build. macOS Intel (darwin-amd64) is not built for now.
  build:
    name: Build (${{ matrix.suffix }})
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [parse-tag]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, pkg_target: node22-linux-x64, suffix: linux-amd64 }
          - { os: ubuntu-24.04-arm, pkg_target: node22-linux-arm64, suffix: linux-arm64 }
          - { os: macos-latest, pkg_target: node22-macos-arm64, suffix: darwin-arm64 }
    env:
      PACKAGES: ${{ join(fromJson(needs.parse-tag.outputs.packages), ' ') }}
      SUFFIX: ${{ matrix.suffix }}
      TEMPO_WALLET_VERSION: ${{ needs.parse-tag.outputs.version }}
      TEMPO_WALLET_PKG_TARGET: ${{ matrix.pkg_target }}
      TEMPO_WALLET_PACKAGE_SUFFIX: ${{ matrix.suffix }}
      TEMPO_WALLET_PACKAGE_DIR: artifacts
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.parse-tag.outputs.release_tag }}
          persist-credentials: false

      - name: Setup pnpm
        uses: tempoxyz/gh-actions/vendor/pnpm/action-setup@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Types and tests run once per release in the verify job, not in each build job.
      - name: Build JavaScript
        run: pnpm build

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          for PACKAGE in $PACKAGES; do
            TEMPO_WALLET_PACKAGE_NAME="$PACKAGE" \
            TEMPO_WALLET_PACKAGE_OUTPUT="artifacts/$PACKAGE-$SUFFIX" \
              pnpm package
          done

      - name: Smoke test binaries
        shell: bash
        run: |
          set -euo pipefail
          for PACKAGE in $PACKAGES; do ./artifacts/"$PACKAGE-$SUFFIX" --version; done

      - name: Generate sha256
        shell: bash
        run: |
          set -euo pipefail
          for PACKAGE in $PACKAGES; do
            BIN="artifacts/$PACKAGE-$SUFFIX"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$BIN" > "$BIN.sha256"
            else
              shasum -a 256 "$BIN" > "$BIN.sha256"
            fi
            cat "$BIN.sha256"
          done

      - name: Generate SBOM for tempo-wallet (SPDX-JSON)
        if: contains(needs.parse-tag.outputs.packages, '"tempo-wallet"')
        uses: tempoxyz/gh-actions/vendor/anchore/sbom-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          file: artifacts/tempo-wallet-${{ matrix.suffix }}
          format: spdx-json
          output-file: artifacts/tempo-wallet-${{ matrix.suffix }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM for tempo-wallet
        if: contains(needs.parse-tag.outputs.packages, '"tempo-wallet"')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/tempo-wallet-${{ matrix.suffix }}
          sbom-path: artifacts/tempo-wallet-${{ matrix.suffix }}.spdx.json

      - name: Generate SBOM for tempo-request (SPDX-JSON)
        if: contains(needs.parse-tag.outputs.packages, '"tempo-request"')
        uses: tempoxyz/gh-actions/vendor/anchore/sbom-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          file: artifacts/tempo-request-${{ matrix.suffix }}
          format: spdx-json
          output-file: artifacts/tempo-request-${{ matrix.suffix }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM for tempo-request
        if: contains(needs.parse-tag.outputs.packages, '"tempo-request"')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/tempo-request-${{ matrix.suffix }}
          sbom-path: artifacts/tempo-request-${{ matrix.suffix }}.spdx.json

      - name: Attest build provenance (SLSA v1)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*-${{ matrix.suffix }}

      - name: Install cosign
        uses: tempoxyz/gh-actions/vendor/sigstore/cosign-installer@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Sign binaries with cosign (keyless)
        shell: bash
        run: |
          set -euo pipefail
          for PACKAGE in $PACKAGES; do
            BIN="artifacts/$PACKAGE-$SUFFIX"
            cosign sign-blob --yes --bundle "$BIN.sigstore.json" "$BIN"
          done

      - name: Upload tempo-wallet
        if: contains(needs.parse-tag.outputs.packages, '"tempo-wallet"')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tempo-wallet-${{ matrix.suffix }}
          path: |
            artifacts/tempo-wallet-${{ matrix.suffix }}
            artifacts/tempo-wallet-${{ matrix.suffix }}.sha256
            artifacts/tempo-wallet-${{ matrix.suffix }}.spdx.json
            artifacts/tempo-wallet-${{ matrix.suffix }}.sigstore.json
          if-no-files-found: error

      - name: Upload tempo-request
        if: contains(needs.parse-tag.outputs.packages, '"tempo-request"')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tempo-request-${{ matrix.suffix }}
          path: |
            artifacts/tempo-request-${{ matrix.suffix }}
            artifacts/tempo-request-${{ matrix.suffix }}.sha256
            artifacts/tempo-request-${{ matrix.suffix }}.spdx.json
            artifacts/tempo-request-${{ matrix.suffix }}.sigstore.json
          if-no-files-found: error



  # Types and the test suite, once per release and sharded as in CI, run alongside the builds;
  # publishing waits for them.
  verify:
    name: Verify ${{ matrix.os }} (${{ matrix.shard }}/${{ matrix.shards }})
    permissions:
      contents: read
      id-token: write
    needs: [parse-tag]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Linux x64 sharded as in CI; every other platform that ships a binary runs the
      # whole suite once, since ci.yml tests only on Linux x64.
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, shards: 5 }
          - { os: ubuntu-latest, shard: 2, shards: 5 }
          - { os: ubuntu-latest, shard: 3, shards: 5 }
          - { os: ubuntu-latest, shard: 4, shards: 5 }
          - { os: ubuntu-latest, shard: 5, shards: 5 }
          - { os: ubuntu-24.04-arm, shard: 1, shards: 1 }
          - { os: macos-latest, shard: 1, shards: 1 }
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.parse-tag.outputs.release_tag }}
          persist-credentials: false

      - name: Setup pnpm
        uses: tempoxyz/gh-actions/vendor/pnpm/action-setup@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 1
        run: pnpm check:types

      - name: Check test types
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 1
        run: pnpm test:types

      - name: Run tests
        run: pnpm test --shard=${{ matrix.shard }}/${{ matrix.shards }}

  # The release signer, built once alongside the binaries rather than in each publish job.
  signer:
    name: Build release signer
    permissions:
      contents: read
      id-token: write
    needs: [parse-tag]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && !startsWith(needs.parse-tag.outputs.release_tag, 'refs/heads/')
    # Any job in the run can upload an artifact under this name, so publish runs the
    # signer only if it matches the digest this job, which runs no release code, built.
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout release signing tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tempoxyz/wallet-rs
          path: wallet-release-tools
          persist-credentials: false

      - name: Setup Rust
        run: rustup default stable

      - name: Build release signer
        run: cargo build --locked --release -p tempo-sign
        working-directory: wallet-release-tools

      - name: Record signer digest
        id: digest
        run: echo "sha256=$(sha256sum wallet-release-tools/target/release/tempo-sign | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signer
          path: wallet-release-tools/target/release/tempo-sign
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.package }}
    environment: release
    permissions:
      contents: write
      id-token: write
    needs: [parse-tag, build, verify, signer]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && !startsWith(needs.parse-tag.outputs.release_tag, 'refs/heads/')
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.parse-tag.outputs.packages) }}
    env:
      PACKAGE: ${{ matrix.package }}
      VERSION: ${{ needs.parse-tag.outputs.version }}
      RELEASE_TAG: ${{ needs.parse-tag.outputs.release_tag }}
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: "10"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.parse-tag.outputs.release_tag }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: ${{ env.PACKAGE }}-*
          merge-multiple: true

      - name: Wait for GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${RELEASE_TAG}"
          for i in $(seq 1 40); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release ${TAG} found"
              exit 0
            fi
            echo "Waiting for release ${TAG}... (attempt ${i}/40)"
            sleep 15
          done
          echo "Release ${TAG} was not created in time" >&2
          exit 1

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --clobber

      - name: Download release signer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signer
          path: wallet-release-tools/target/release

      - name: Verify release signer
        env:
          SIGNER_SHA256: ${{ needs.signer.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -n "$SIGNER_SHA256"
          echo "$SIGNER_SHA256  wallet-release-tools/target/release/tempo-sign" | sha256sum -c -
          chmod +x wallet-release-tools/target/release/tempo-sign

      - name: Sign release binaries
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          echo -n "$RELEASE_SIGNING_KEY" | base64 -d > /tmp/release.key

          URL_PREFIX="https://cli.tempo.xyz/extensions/${PACKAGE}"

          declare -A PKG_DESC=(
            [tempo-wallet]="Manage your Tempo Wallet"
            [tempo-request]="Make an HTTP request"
          )

          SIGN_ARGS=(
            --key-file /tmp/release.key
            --artifacts-dir artifacts
            --version "$VERSION"
            --base-url "$URL_PREFIX"
            --description "${PKG_DESC[$PACKAGE]}"
            --output "artifacts/${PACKAGE}-manifest.json"
          )

          if [ "$PACKAGE" = "tempo-request" ] && [ -f "SKILL.md" ]; then
            SKILL_SHA256=$(sha256sum "SKILL.md" | cut -d' ' -f1)
            SIGN_ARGS+=(
              --skill "${URL_PREFIX}/v${VERSION}/SKILL.md"
              --skill-sha256 "$SKILL_SHA256"
              --skill-file "SKILL.md"
            )
          fi

          ./wallet-release-tools/target/release/tempo-sign sign "${SIGN_ARGS[@]}"

          rm /tmp/release.key

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail

          aws configure set default.s3.multipart_threshold 8MB
          aws configure set default.s3.multipart_chunksize 8MB

          PREFIX="extensions/${PACKAGE}"
          VTAG="v${VERSION}"

          upload_to_r2() {
            local source="$1"
            local destination="$2"
            local content_type="${3:-}"
            local immutable="${4:-false}"
            local attempt
            local local_sha
            local remote_sha
            local -a args

            if [ "$immutable" = "true" ]; then
              local_sha=$(sha256sum "$source" | cut -d' ' -f1)
              if remote_sha=$(aws s3 cp "$destination" - --endpoint-url "$AWS_ENDPOINT_URL" --only-show-errors 2>/dev/null | sha256sum | cut -d' ' -f1); then
                if [ "$remote_sha" = "$local_sha" ]; then
                  echo "Verified existing immutable R2 object: ${destination}"
                  return 0
                fi

                echo "Immutable R2 object collision at ${destination}" >&2
                echo "Expected sha256 ${local_sha}, found ${remote_sha}" >&2
                return 1
              fi
            fi

            for attempt in 1 2 3; do
              args=(s3 cp "$source" "$destination" --endpoint-url "$AWS_ENDPOINT_URL" --only-show-errors)
              if [ -n "$content_type" ]; then
                args+=(--content-type "$content_type")
              fi

              if aws "${args[@]}"; then
                return 0
              fi

              if [ "$immutable" = "true" ] && remote_sha=$(aws s3 cp "$destination" - --endpoint-url "$AWS_ENDPOINT_URL" --only-show-errors 2>/dev/null | sha256sum | cut -d' ' -f1); then
                if [ "$remote_sha" = "$local_sha" ]; then
                  echo "Verified immutable R2 object after an ambiguous upload response: ${destination}"
                  return 0
                fi

                echo "Immutable R2 object collision at ${destination}" >&2
                echo "Expected sha256 ${local_sha}, found ${remote_sha}" >&2
                return 1
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "::warning::R2 upload failed for ${destination}; retrying outer attempt $((attempt + 1))/3"
                sleep $((attempt * 10))
              fi
            done

            echo "R2 upload failed after 3 outer attempts: ${destination}" >&2
            return 1
          }

          for f in "artifacts/${PACKAGE}"-linux-* "artifacts/${PACKAGE}"-darwin-*; do
            [ -f "$f" ] || continue
            BASENAME=$(basename "$f")
            upload_to_r2 "$f" "s3://tempo-cli/${PREFIX}/${VTAG}/${BASENAME}" "" "true"
          done

          upload_to_r2 "artifacts/${PACKAGE}-manifest.json" "s3://tempo-cli/${PREFIX}/${VTAG}/manifest.json" "" "true"

          if [ "$PACKAGE" = "tempo-request" ] && [ -f "SKILL.md" ]; then
            upload_to_r2 "SKILL.md" "s3://tempo-cli/${PREFIX}/${VTAG}/SKILL.md" "text/markdown" "true"
          fi

          upload_to_r2 "artifacts/${PACKAGE}-manifest.json" "s3://tempo-cli/${PREFIX}/manifest.json"
          printf '%s\n' "$VERSION" > "artifacts/${PACKAGE}-VERSION"
          upload_to_r2 "artifacts/${PACKAGE}-VERSION" "s3://tempo-cli/${PREFIX}/VERSION" "text/plain"

          echo "Released ${PACKAGE}@${VERSION}"

  publish-release:
    name: Publish GitHub Release
    environment: release
    permissions:
      contents: write
      id-token: write
    needs: [parse-tag, publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && !startsWith(needs.parse-tag.outputs.release_tag, 'refs/heads/')
    env:
      RELEASE_TAG: ${{ needs.parse-tag.outputs.release_tag }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft')" = true
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
