overrides:
  esbuild: 0.28.2
  # One mppx in the install and the bundle: machine-fetch's mppx peer resolves to the vendored copy.
  mppx: file:./vendor/mppx
  source-map-js: 1.2.2
  tar: 7.5.22
  tinypool: 2.1.2
  ws: 8.21.0

allowBuilds:
  esbuild: true

minimumReleaseAge: 10080
trustPolicy: no-downgrade

minimumReleaseAgeExclude:
  - accounts@0.21.0
  - incur@0.7.1
  - viem@2.57.1

patchedDependencies:
  incur@0.7.1: patches/incur@0.7.1.patch
